name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen

      - name: Generate project
        run: make project

      # Ad-hoc signed with the hardened runtime; notarization needs a Developer ID (see README).
      - name: Build release
        run: >
          xcodebuild -project Snapbolt.xcodeproj -scheme Snapbolt -configuration Release
          -derivedDataPath build -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=- OTHER_CODE_SIGN_FLAGS="--options=runtime" build

      - name: Package
        run: ditto -c -k --keepParent build/Build/Products/Release/Snapbolt.app "Snapbolt-${GITHUB_REF_NAME}.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "Snapbolt-${GITHUB_REF_NAME}.zip" --generate-notes
