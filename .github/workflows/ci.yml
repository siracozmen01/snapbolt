name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Build app
        run: make build XCODEBUILD_FLAGS="CODE_SIGNING_ALLOWED=NO"

      - name: Test package
        run: make test

      - name: Lint
        run: make lint
